server:
  port: 8184
  servlet:
    context-path: /elastic-query-web-client

elastic-query-web-client:
  webclient:
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
    max-in-memory-size: 10485760
    content-type: 'application/json'
    accept-type: 'text/event-stream'
    base-url: 'http://localhost:8183/reactive-elastic-query-service/document'
  query-by-text:
    method: POST
    uri: "/get-doc-by-text"
    accept: ${elastic-query-web-client.webclient.accept-type}

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: 'elastic-query-web-client'
            client-secret: 'KEYCLOAK secret'
            authorization-grant-type: authorization_code
            redirect-uri: '{base}/login/oauth2/code/{registrationId}'
            scope: openid
        provider:
          keycloak:
            issuerUri: http://localhost:8081/auth/realms/microservices-realm
  webflux:
    base-path: /reactive-elastic-query-web-client
  thymeleaf:
    cache: false
    reactive:
      max-chunk-size: 8192
  codec:
    max-in-memory-size: 25MB

security:
  logout-success-url: http://localhost:8081/auth/realms/microservices-realm
  default-client-registration-id: keycloak

user-config:
  username: test
  password: '{cipher}etc'
  roles: USER